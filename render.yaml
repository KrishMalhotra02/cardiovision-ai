# Deploy API from repository root so `backend`, `data/raw` and model artifacts resolve.
services:
  - type: web
    name: cardiovision-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements-deploy.txt
    startCommand: python -m uvicorn backend.app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: CARDIO_ALLOWED_ORIGINS
        sync: false
